
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Subject Dashboard</title>
  <link rel="stylesheet" href=

"https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

<script src=

"https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">

</script>
  <link rel="stylesheet" href="https://jsdelivr.net">
</head>
<body class="bg-light">

  <div class="container my-4">

    
    <div class="jumbotron bg-primary text-white shadow-sm">
      <h1 class="display-4 font-weight-bold">Student Learning Dashboard</h1>
      
      <hr class="my-4 border-light">
      
      
      <div class="d-flex flex-wrap" style="gap: 10px;">
        <button type="button" class="btn btn-light text-primary font-weight-bold">View All Courses</button>
        <button type="button" class="btn btn-success">Submit Assignment</button>
        <button type="button" class="btn btn-warning">Upcoming Exams</button>
        <button type="button" class="btn btn-info">Download Report</button>
        <button type="button" class="btn btn-danger">Pending Alerts</button>
      </div>
    </div>

   
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h4 class="card-title mb-3">Quick Overview</h4>
        <div class="d-flex flex-wrap align-items-center" style="gap: 15px;">
          <span class="badge badge-primary p-2">Enrolled Subjects: 4</span>
          <span class="badge badge-success p-2">Completed Modules: 18</span>
          <span class="badge badge-warning p-2">Assignments Due: 2</span>
          <span class="badge badge-info p-2">Attendance: 94%</span>
          <span class="badge badge-secondary p-2">Term: Semester 1</span>
        </div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title mb-4">Subject Progress</h4>

        
        <div class="mb-3">
          <div class="d-flex justify-content-between mb-1">
            <span class="font-weight-bold">Web Development (HTML & Bootstrap)</span>
            <span class="badge badge-success">90% Complete</span>
          </div>
          <div class="progress" style="height: 22px;">
            <div class="progress-bar bg-success progress-bar-striped" role="progressbar" style="width: 90%;" aria-valuenow="90" aria-valuemin="0" aria-valuemax="100">90%</div>
          </div>
        </div>

       
        <div class="mb-3">
          <div class="d-flex justify-content-between mb-1">
            <span class="font-weight-bold">Mathematics</span>
            <span class="badge badge-primary">75% Complete</span>
          </div>
          <div class="progress" style="height: 22px;">
            <div class="progress-bar bg-primary progress-bar-striped" role="progressbar" style="width: 75%;" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">75%</div>
          </div>
        </div>

        
        <div class="mb-3">
          <div class="d-flex justify-content-between mb-1">
            <span class="font-weight-bold">Science</span>
            <span class="badge badge-info">60% Complete</span>
          </div>
          <div class="progress" style="height: 22px;">
            <div class="progress-bar bg-info progress-bar-striped" role="progressbar" style="width: 60%;" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100">60%</div>
          </div>
        </div>

       
        <div>
          <div class="d-flex justify-content-between mb-1">
            <span class="font-weight-bold">History</span>
            <span class="badge badge-warning">40% In Progress</span>
          </div>
          <div class="progress" style="height: 22px;">
            <div class="progress-bar bg-warning text-dark progress-bar-striped" role="progressbar" style="width: 40%;" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100">40%</div>
          </div>
        </div>

      </div>
    </div>

  </div>

 
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
</body>
</html>
