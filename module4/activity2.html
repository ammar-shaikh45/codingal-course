<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>function in java script</title>
</head>
<body>
    <input type="number" id="num1" placeholder="1">

    <input type="number" id="num2" placeholder="2"><br>
    <button onclick="ammar()">division</button><br>
    <p id="result"></p>
    <script>
        function ammar(){
            let num1=document.getElementById("num1").value;
            let num2=document.getElementById("num2").value;
            let product=num1/num2
            document.getElementById("result").innerHTML="tha product of number is "+product
        }
    </script><br>
     
</body>
</html>
